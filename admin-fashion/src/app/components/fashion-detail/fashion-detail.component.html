<div *ngIf="fashion">
  <h2 class="mb-3">{{ fashion.title }}</h2>
  <img [src]="fashion.thumbnail" [alt]="fashion.title" class="img-fluid mb-3" />
  <p><strong>Style:</strong> {{ fashion.style }}</p>
  <p><strong>Created:</strong> {{ fashion.creationDate | date: 'yyyy-MM-dd' }}</p>
  <div [innerHTML]="fashion.details" class="mt-3"></div>
  <div class="mt-4">
    <a class="btn btn-outline-secondary" routerLink="/fashions">Back</a>
  </div>
</div>
